<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Все записи</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <div class="pt-5 pb-5 container">
        <h1 class="display-1 mb-4">Все заявки</h1>
        <div class="row">
            {% for booking in bookings %}
            <div class="col-md-3 mb-4">
                <div class="card text-bg-primary mb-3">
                    <div class="card-header">Номер заявки: {{booking[0]}}</div>
                    <div class="card-body">
                      <p class="card-text">Имя: {{ booking[1] }}</p>
                      <p class="card-text">Номер телефона: {{booking[2]}}</p>
                      <p class="card-text">Выбранный мастер: {{ booking[3] }}</p>
                      <p class="card-text">Услуга: {{booking[4]}}</p>
                      <p class="card-text">Дата брони: {{booking[5]}}</p>
                      <p class="card-text">Время брони: {{booking[6]}}</p>
                    </div>
                    <div class="card-footer">
                        <form action="{{ url_for('delete', booking_id=booking[0]) }}" method="post">
                            <button type="submit" class="btn btn-danger">Удалить</button>
                        </form>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
        
    </div>
</body>
</html>
